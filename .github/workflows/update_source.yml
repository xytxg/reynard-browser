name: Validate AltSource metadata (manual only)

# The original upstream updater publishes to a hard-coded upstream release tag
# using a token that this fork does not own. Do not run it on fork prereleases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing upstream-compatible source metadata
        run: python3 -m json.tool .github/source.json > /dev/null
